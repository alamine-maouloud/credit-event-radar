# Demo watchlist (docs/SPEC.md, section 5).
#
# Issuer ids are stable identifiers used everywhere (seed, events, alerts). Names and
# aliases feed the deterministic issuer resolution (Phase 2). Nothing here is a rating:
# ratings live in data/seeds/ratings_seed.csv with their sources.
#
# sec_cik is only filled when a source in the seed cites that CIK. ir_sources lists the
# official investor-relations sources checked by hand (robots.txt and terms of use, see
# docs/ARCHITECTURE.md ADR-010) and how documents are discovered in them.

name: Demo watchlist
disclosure: >-
  Demo universe constructed exclusively from publicly disclosed holdings and publicly
  available R&Co Asset Management research. Portfolio disclosures retrieved as of 06/10/2026.
retrieved_as_of: 2026-10-06

issuers:
