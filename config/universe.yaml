    segments: ["Financial Services Division", "Financial Services"]
    country: "DE"
    sec_cik: null
    ratings_page: https://www.volkswagen-group.com/en/ratings-15756
    ir_sources:
      - id: vw_press_rss
        kind: rss
        url: https://www.volkswagen-group.com/en/feeds/press-releases
        document_type: press_release
        note: Official press release feed (robots.txt allows all, checked 2026-10-06)
