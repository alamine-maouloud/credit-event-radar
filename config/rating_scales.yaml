# Rating scales mapped to a common notch scale (docs/SPEC.md, section 9.1).
# Notch 1 is the strongest rating, notch 22 is default. The IG/HY boundary sits
# between notch 10 (BBB-, Baa3, BBB (low)) and notch 11 (BB+, Ba1, BB (high)).
#
# DBRS is not in the SPEC table but appears in the hand-verified seed. It is mapped
# to the same notches so that any agency can be compared, but the composite rating
# only uses the agencies listed in settings.yaml (ratings.composite_agencies).

version: "1.0"

boundary:
  last_ig_notch: 10
  first_hy_notch: 11

categories:
  IG: { min: 1, max: 10 }
  HY: { min: 11, max: 21 }
  DEFAULT: { min: 22, max: 22 }

# Tokens meaning "not rated" or "withdrawn": excluded from any computation.
unrated_tokens: ["NR", "WD", "WR", "N/A", "NOT RATED", "WITHDRAWN"]

agencies:
