# Runtime settings (models, thresholds, intervals, paths). Secrets never live here:
# they are read from .env through the *_env keys below.

version: "1.0"

llm:
  default_provider: openai
  cache_dir: data/llm_cache
  # Hard stop before any call that would exceed the run budget (.env, see .env.example)
  run_budget_usd_env: LLM_RUN_BUDGET_USD
  # Prices live in a versioned file, never in the code
  pricing_file: config/llm_pricing.yaml
  # Temperature 0 everywhere. Responses are cached by document hash, extractor version,
  # provider, exact model id, prompt version, schema version and reasoning effort.
  roles:
    extraction:
      provider: openai
      model: gpt-5.6-terra
      temperature: 0
      reasoning_effort: low
    notes:
      provider: openai
      model: gpt-5.6-terra
      temperature: 0
      reasoning_effort: low
    verification:
      provider: openai
      model: gpt-5.6-terra
      temperature: 0
      reasoning_effort: low
  # Benchmark (SPEC 15.4): exact ids only, never the bare alias gpt-5.6. Anthropic stays
  # TO_CONFIRM until the official catalogue is checked on the day of the first real run.
  benchmark_alternatives:
    openai_terra:
      extraction:
        provider: openai
        model: gpt-5.6-terra
        temperature: 0
        reasoning_effort: low
    openai_sol:
      extraction:
        provider: openai
        model: gpt-5.6-sol
        temperature: 0
        reasoning_effort: low
    anthropic:
      extraction:
        provider: anthropic
        model: TO_CONFIRM
        temperature: 0
  # Routing per extraction kind (ADR-020), decided on the benchmarks of 2026-10-06
  # (docs/BENCHMARK.md). `radar llm-extract --kind X` uses the default, `--challenger` the
  # challenger, `--alternative <name>` any entry above; the reason is written in every run,
  # every stored statement and every explanation. TO_BENCHMARK refuses the default until the
  # family has its benchmark.
  routing:
    guidance:
      default: openai_terra
      challenger: openai_sol
      reason: "guidance gold V1 (2026-10-06): Terra with the deterministic guardrails reaches precision 1.000 and recall 0.965 against Sol 0.982, for 1.19 USD against 1.96 USD"
    liquidity:
      default: openai_terra
      challenger: openai_sol
      reason: "liquidity gold V1 and blind holdouts V2, V3 (2026-10-06): both models find the same stress cases, Terra at the lower cost"
    covenant:
      default: openai_sol
      challenger: openai_terra
      reason: "covenant gold V1 and its two holdouts (2026-10-06): Sol finds 4 of 4 breach cases at the decision level against 2 of 4 for Terra, with no false flag observed for either, at about twice the cost; a holdout result on this gold, not a general claim"
    going_concern:
      default: openai_terra
      challenger: null
      reason: "Gold V1 DEV (2026-10-07): document flag precision=1.00, recall=1.00, 7/7 stress cases detected, 0 false flags, cost=$1.84. Sol not benchmarked to control evaluation cost"

ratings:
  # middle: median notch (lowest of two, the single one if alone)
  # average: mean notch rounded with composite_rounding
  composite_method: middle
  # nearest_weaker: nearest notch, ties to the weaker side (default)
  # ceil: any fraction goes to the weaker notch (strict reading of SPEC 9.2)
  # floor: toward the stronger notch
  composite_rounding: nearest_weaker
  # DBRS is mapped in rating_scales.yaml but excluded from the composite by default.
  composite_agencies: [SP, MOODYS, FITCH]

paths:
  db: data/radar.db
  raw: data/raw
  outputs: outputs
  seeds: data/seeds

ingestion:
  poll_interval_minutes: 15
  sec:
    user_agent_env: SEC_USER_AGENT
    max_requests_per_second: 8
  # Issuer investor-relations sites: declared User-Agent, robots.txt respected, polite cadence.
  ir:
    user_agent_env: IR_USER_AGENT
    min_interval_seconds: 2.0
    respect_robots: true
    timeout_seconds: 30

alerts:
  # SPEC 11.1. Local rendering is mandatory for every priority.
  routing:
    P1:
      channels: [teams, email, local]
      mode: immediate
    P2:
      channels: [teams, email, local]
      mode: digest
      digest_every_hours: 4
    P3:
      channels: [email, local]
      mode: digest
      digest_every_hours: 24
  teams_webhook_env: TEAMS_WEBHOOK_URL
