[project]
name = "credit-event-radar"
version = "0.1.0"
description = "Auditable AI-assisted credit monitoring: detect, prioritise, explain, source, alert. The human analyst decides."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Al-Amine Sidick Maouloud" }]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
radar = "radar.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint.isort]
known-first-party = ["radar", "tests"]
