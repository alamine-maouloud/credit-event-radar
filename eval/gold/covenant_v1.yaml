# Covenant gold set V1, hand-written labels (eval/COVENANT_LABELING_GUIDE.md). DRAFT until frozen.
# status compliant | risk_of_breach | breached | mentioned ; resolution none | waived | cured | amended.
# A breach stays breached whatever its resolution; a payment default is not a covenant breach.
