  - gold_id: C-GPRO-01
    fixture: tests/fixtures/edgar/gopro_10q_2026q1
    split: dev
    expected_flag: true
    notes: Breaches of the 2025 Credit Agreement covenants, waived or cured, with an anticipated future non-compliance. "cured or waived" in one sentence is labelled cured, waived is equally defensible.
    statements:
      - status: breached
        resolution: waived
        agreement: "2025 Credit Agreement"
        evidence_quote: "Additionally, as of March 31, 2026, the Company was not in compliance with the financial covenants under its 2025 Credit Agreement due to the impact of the timing of redemption of sales incentives, revenue mix, and timing of working capital changes which impact the covenant calculation. The Company subsequently received a waiver from the lender of the 2025 Credit Agreement on May 8, 2026."
      - status: mentioned
        evidence_quote: "Future non-compliance with financial covenants may limit the Company’s access to existing credit facilities or result in an acceleration of debt obligations, which would further adversely impact liquidity."
      - status: breached
        resolution: cured
        evidence_quote: "Additionally, the Company has not met certain covenants in the last two quarters which were subsequently cured or waived and does not expect to be able to meet the future minimum financial covenants in its 2021 Credit Agreement and 2025 Credit Agreement, including, but not limited to minimum liquidity, minimum EBITDA and a minimum asset coverage ratio, as further discussed in Note 4."
      - status: risk_of_breach
        evidence_quote: "The Company is actively evaluating potential remediation options for the expectation that it will be unable to comply with its financial covenants under the 2021 Credit Agreement and the 2025 Credit Agreement within the next twelve months, including seeking waivers or amendments from its lenders."
      - status: mentioned
        agreement: "2021 Credit Agreement"
        evidence_quote: "The 2021 Credit Agreement contains customary representations, warranties, affirmative and negative covenants, and events of default."
      - status: compliant
        evidence_quote: "For the period ended December 31, 2025, the Company was in compliance with the liquidity and asset coverage ratio financial covenants contained in the 2021 Credit Agreement; however, the 2021 Credit Agreement also required the Company to be in compliance with the financial covenants within the 2025 Credit Agreement."
      - status: breached
        resolution: cured
        covenant_label: "minimum EBITDA covenant"
        evidence_quote: "The Company was not in compliance with the 2025 Credit Agreement asset coverage ratio of 1.25x or the minimum EBITDA covenant of not less than $10.0 million for the fiscal quarter ending December 31, 2025 and subsequently cured the non-compliance by entering into an amendment on February 27, 2026."
      - status: breached
        resolution: none
        covenant_label: "minimum asset coverage ratio"
        evidence_quote: "For the period ended March 31, 2026, the Company was in compliance with the liquidity and asset coverage ratio financial covenants contained in the 2021 Credit Agreement; however, the Company was not in compliance with the minimum asset coverage ratio of 1.05x under the 2025 Credit Agreement."
      - status: breached
        resolution: waived
        evidence_quote: "On May 8, 2026, the Company received a waiver from the Lender under the 2025 Credit Agreement waiving the asset coverage ratio non-compliance as of March 31, 2026."
    ineligible:
      - reason: not_covenant
        evidence_quote: "Upon an event of default, the lender may, subject to customary cure rights, require the immediate payment of all amounts outstanding."

