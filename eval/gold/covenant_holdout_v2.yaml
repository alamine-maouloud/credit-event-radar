# Covenant holdout V2, the blind test (2026-10-06). Five 10-Q filings chosen from EDGAR metadata
# only (full-text search hit counts on three covenant stress queries, then filing date, plus two
# large investment-grade filers as controls), never read before these labels. Code frozen at
# commit b73f2f1: no prompt, schema, validator, guide or label change after the selection.
# Distribution as found: three issuers with stated current breaches (all three waived or under
# forbearance), two stable issuers whose filings never speak of debt covenants. No trap document
# this time. Passages the frozen wording rules cannot read as a breach or an anticipation are
# labelled mentioned and named in the notes as limits.
