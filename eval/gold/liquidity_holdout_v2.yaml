# Liquidity holdout V2: five filings chosen from EDGAR metadata only on 2026-10-06, never read
# before these labels were written. After the freeze nothing changes: prompt, schema, validator,
# polarity rules, labels. Document level expectation first, statements second.
version: "1.0"
documents:
  - gold_id: H2-NFE
    fixture: tests/fixtures/edgar/new_fortress_energy_10q_2026q2
    split: holdout
    expected_flag: true
    notes: Restructuring support agreement after events of default, substantial doubt, delayed interest payments. Many generic risk factors are left unlabelled; the Brazil business sentences are a segment.
    statements:
      - status: deteriorated
        evidence_quote: "These outflows were partially offset by improved collections on outstanding receivables and as a result of liquidity constraints, we delayed certain interest payments, increasing accrued interest."
      - status: concern
        evidence_quote: "management has concluded that, our current liquidity and forecasted cash flows from operations are not probable to be sufficient to support, in full, obligations as they become due over the next twelve-month period"
      - status: concern
        evidence_quote: "If our indebtedness under any of the foregoing facilities or agreements were accelerated, we would not have sufficient liquidity to repay such amounts, and we may be forced to seek additional waivers, amendments, or alternative restructuring transactions, including potentially commencing formal insolvency proceedings."
      - status: concern
        evidence_quote: "The Company must also meet the Minimum Liquidity Threshold at closing, and if this threshold is not met, it may be required to raise additional capital under tight time constraints, which may not be possible on acceptable terms."
      - status: concern
        evidence_quote: "adequately addressing the substantial doubt as to our ability to continue as a going concern and satisfy our liquidity needs, including the consummation of certain items that management expects to occur and other transactions intended to enhance our liquidity;"
      - status: mentioned
        evidence_quote: "Certain lenders have also agreed to provide the Company with incremental funding in exchange for additional term loans or additional letter of credit facility capacity to support ongoing operations and liquidity needs."
      - status: mentioned
        evidence_quote: "We used the proceeds to repay existing debt and to provide additional liquidity."
      - status: mentioned
        evidence_quote: "Differences between the date when we pay our suppliers and the date when we receive payments from our customers may adversely affect our liquidity and our cash flows."
    ineligible:
      - reason: segment
        evidence_quote: "If a satisfactory resolution is not reached and Celba fails to deliver gas in accordance with contractual requirements prospectively, the contract provides for certain monetary payments that Celba would owe to Alunorte, which could be material and would adversely affect the liquidity of the Brazil business."
      - reason: segment
        evidence_quote: "In addition, Alunorte could pursue further claims or commence arbitration against Celba which, if resolved against Celba, could adversely affect the Brazil business' liquidity and results of operations."

