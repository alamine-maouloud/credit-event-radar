  - gold_id: H2-F
    fixture: tests/fixtures/edgar/ford_motor_10q_2026q2
    split: holdout
    expected_flag: false
    notes: Strong Company liquidity with a long list of risk factors and a financial services segment (Ford Credit) whose liquidity is not the Group's statement.
    statements:
      - status: stable
        metric_label: "liquidity"
        value: 43.4
        unit: USD_BN
