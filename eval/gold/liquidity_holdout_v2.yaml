      - reason: segment
        evidence_quote: "At June 30, 2026, Ford Credit’s net liquidity available for use was $27.4 billion, $2.8 billion higher than year-end 2025, reflecting strong access to public funding markets."
      - reason: segment
        evidence_quote: "Ford Credit ended the second quarter of 2026 with $27.4 billion of liquidity, up $2.8 billion from year-end."
      - reason: not_liquidity
        evidence_quote: "The corporate credit facility contains a liquidity covenant that requires us to maintain a minimum of $4 billion in aggregate of domestic cash, cash equivalents, and loaned and marketable securities"
