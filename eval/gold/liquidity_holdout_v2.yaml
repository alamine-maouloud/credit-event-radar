      - status: concern
        evidence_quote: "strategy cannot be guaranteed to ensure sufficient cash flow is generated to provide liquidity to meet the Company’s"
      - status: mentioned
        evidence_quote: "Historically, the Company has relied principally on liquidity generated from operating activities to fund the Company’s day-"
      - status: mentioned
        evidence_quote: "The Company’s primary sources of liquidity are cash flows provided by operating activities and cash available under its"
